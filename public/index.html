<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>REUM — Luminous Swedish Homeware (reum.store)</title>
  <meta name="description" content="A cinematic 3D botanical dream space for Swedish whimsical homeware brand Reum.store. Wander through glowing Nordic flora, tactile ceramics, and turned wood.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090A0E;
      --paper: #F6F2EB;
      --gold: #E5C384;
      --amber: #FF9B42;
      --lingon: #D93829;
      --moss: #3B5A45;
      --bone: #F5EFE6;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--bone);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    @media (pointer: fine) {
      body {
        cursor: none;
      }
    }

    /* WebGL Canvas */
    #webgl-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      touch-action: none;
    }

    /* Cinematic Vignette & Grain Overlay */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(5, 6, 8, 0.75) 100%);
    }

    #film-grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 11;
      mix-blend-mode: overlay;
      opacity: 0.22;
    }

    /* Minimalist High-Fashion Fluid Cursor */
    #cursor {
      position: fixed;
      width: 48px;
      height: 48px;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1000;
      transform: translate(-50%, -50%);
      display: none;
    }

    @media (pointer: fine) {
      #cursor {
        display: block;
      }
    }

    .cur-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid rgba(245, 239, 230, 0.65);
      display: grid;
      place-items: center;
      transition: transform 0.4s var(--ease), border-color 0.3s, background-color 0.3s;
    }

    .cur-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      transition: transform 0.3s var(--ease), opacity 0.3s;
    }

    .cur-label {
      position: absolute;
      font-family: 'Antonio', sans-serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #FFF;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.3s var(--ease);
    }

    #cursor.hover .cur-ring {
      transform: scale(1.6);
      border-color: var(--gold);
      background: rgba(229, 195, 132, 0.15);
      backdrop-filter: blur(2px);
    }
    #cursor.hover .cur-dot {
      opacity: 0;
    }
    #cursor.hover .cur-label {
      opacity: 1;
      transform: scale(1);
    }

    #cursor.drag .cur-ring {
      transform: scale(0.8);
      border-color: var(--amber);
    }

    /* INTERFACE LAYER (Above WebGL) */
    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 48px;
    }

    .ui-layer a, .ui-layer button, .ui-layer .interactive {
      pointer-events: auto;
    }

    /* Top Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .brand-group {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .brand-logo {
      font-family: 'Antonio', sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bone);
      transition: color 0.3s;
    }

    .brand-logo:hover {
      color: var(--gold);
    }

    .brand-sub {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      font-size: 14px;
      color: rgba(245, 239, 230, 0.6);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .glass-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #14171F;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      padding: 10px 24px;
      border-radius: 99px;
      color: #FFFFFF;
      font-family: 'Antonio', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: all 0.25s var(--ease);
      cursor: pointer;
    }

    .glass-btn:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: #090A0E;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(229, 195, 132, 0.35);
    }

    .sound-bars {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 14px;
    }

    .sound-bar {
      width: 2px;
      background: currentColor;
      border-radius: 1px;
      height: 3px;
      transition: height 0.2s;
    }

    body.sound-active .sound-bar:nth-child(1) { animation: s-anim 0.6s infinite alternate; }
    body.sound-active .sound-bar:nth-child(2) { animation: s-anim 0.8s 0.2s infinite alternate; }
    body.sound-active .sound-bar:nth-child(3) { animation: s-anim 0.5s 0.4s infinite alternate; }

    @keyframes s-anim {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    /* Center Ambient Hero Copy */
    .hero-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      width: 100%;
      max-width: 900px;
      padding: 0 24px;
      transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
    }

    .hero-center.blurred {
      opacity: 0.15;
      transform: translate(-50%, -50%) scale(0.96);
    }

    .hero-eyebrow {
      font-family: 'Antonio', sans-serif;
      font-size: 13px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      opacity: 0.85;
    }

    .hero-headline {
      font-family: 'Antonio', sans-serif;
      font-size: clamp(54px, 9.5vw, 128px);
      line-height: 0.88;
      letter-spacing: -0.015em;
      text-transform: uppercase;
      color: var(--bone);
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .hero-headline span {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      font-weight: 300;
      color: var(--gold);
      text-transform: none;
      letter-spacing: 0;
    }

    .hero-caption {
      margin-top: 24px;
      font-family: 'Newsreader', Georgia, serif;
      font-size: clamp(16px, 1.8vw, 20px);
      line-height: 1.45;
      color: rgba(245, 239, 230, 0.75);
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Bottom Bar & Instructions */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .active-counter {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.1em;
    }

    .carousel-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #14171F;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      padding: 6px 16px;
      border-radius: 99px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .nav-arrow-btn {
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 99px;
      transition: color 0.2s, transform 0.2s;
      cursor: pointer;
    }

    .nav-arrow-btn:hover {
      color: var(--gold);
      transform: scale(1.15);
    }

    .active-title-btn {
      font-family: 'Antonio', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #FFFFFF;
      padding: 6px 14px;
      transition: color 0.2s;
      cursor: pointer;
    }

    .active-title-btn:hover {
      color: var(--gold);
    }

    .inspect-btn {
      background: #14171F;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      font-family: 'Antonio', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 10px 24px;
      border-radius: 99px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: all 0.25s var(--ease);
    }

    .inspect-btn:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: #090A0E;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(229, 195, 132, 0.35);
    }

    @media (max-width: 768px) {
      .ui-layer {
        padding: 20px;
      }
      .brand-sub {
        display: none;
      }
      .instruction-text {
        display: none;
      }
      .bottom-bar {
        justify-content: center;
      }
    }

    /* OBJECT DETAIL OVERLAY (Cinematic Inspection Sheet) */
    #detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(9, 10, 14, 0.75);
      backdrop-filter: blur(28px);
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      padding: 80px 8vw;
      align-items: center;
      gap: 6vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s var(--ease);
    }

    #detail-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .detail-left {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 520px;
    }

    .detail-close-btn {
      position: fixed;
      top: 36px;
      right: 48px;
      font-family: 'Antonio', sans-serif;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--bone);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 24px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .detail-close-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .det-badge {
      font-family: 'Antonio', sans-serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .det-title {
      font-family: 'Antonio', sans-serif;
      font-size: clamp(42px, 5.5vw, 76px);
      line-height: 0.95;
      letter-spacing: -0.015em;
      text-transform: uppercase;
      color: var(--bone);
    }

    .det-swedish {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      font-size: 18px;
      color: var(--gold);
    }

    .det-desc {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 18px;
      line-height: 1.55;
      color: rgba(245, 239, 230, 0.85);
      margin-top: 6px;
    }

    .det-specs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
      color: rgba(245, 239, 230, 0.6);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 16px;
    }

    .det-action-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 16px;
    }

    .det-price {
      font-family: 'Antonio', sans-serif;
      font-size: 38px;
      font-weight: 700;
      color: var(--bone);
    }

    .det-buy-btn {
      flex: 1;
      background: var(--gold);
      color: #090A0E;
      font-family: 'Antonio', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 16px 32px;
      border-radius: 99px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(229, 195, 132, 0.3);
      transition: all 0.3s var(--ease);
    }

    .det-buy-btn:hover {
      background: #FFF;
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(229, 195, 132, 0.5);
    }

    .detail-right {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .det-img-frame {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 4 / 5;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .det-img-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 820px) {
      #detail-overlay {
        grid-template-columns: 1fr;
        padding: 80px 24px 40px;
        overflow-y: auto;
      }
      .detail-right {
        order: -1;
      }
      .det-img-frame {
        max-width: 280px;
      }
    }

    /* CART SLIDE DRAWER */
    #cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(440px, 100vw);
      background: #0D0F14;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 200;
      transform: translateX(105%);
      transition: transform 0.5s var(--ease);
      box-shadow: -20px 0 60px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
    }

    #cart-drawer.open {
      transform: translateX(0);
    }

    .cart-head {
      padding: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-title {
      font-family: 'Antonio', sans-serif;
      font-size: 24px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--bone);
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 24px 30px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .cart-item {
      display: flex;
      gap: 16px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
    }

    .cart-foot {
      padding: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: #090A0E;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s var(--ease), visibility 1s;
    }

    #loader.gone {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 20px var(--gold);
      animation: pulse-load 1.4s infinite ease-in-out;
    }

    @keyframes pulse-load {
      0%, 100% { transform: scale(0.6); opacity: 0.4; }
      50% { transform: scale(1.6); opacity: 1; }
    }
  </style>

  <!-- Three.js (r128 via Cloudflare CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Fullscreen WebGL 3D Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Film Grain & Vignette -->
  <div id="vignette"></div>
  <svg id="film-grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix values="0 0 0 0 0.8   0 0 0 0 0.8   0 0 0 0 0.8   0 0 0 0.25 0" />
    </filter>
    <rect width="100%" height="100%" filter="url(#grain)" />
  </svg>

  <!-- Custom Cursor -->
  <div id="cursor">
    <div class="cur-ring">
      <div class="cur-dot"></div>
    </div>
  </div>

  <!-- Intro Loader -->
  <div id="loader">
    <div class="loader-dot"></div>
  </div>

  <!-- UI OVERLAY -->
  <div class="ui-layer">
    
    <!-- Header -->
    <header>
      <div class="brand-group">
        <a href="#" class="brand-logo">REUM</a>
      </div>

      <div class="nav-actions">
        <button class="glass-btn" id="sound-btn" onclick="toggleSound()">
          <span>Sound</span>
          <div class="sound-bars">
            <div class="sound-bar"></div>
            <div class="sound-bar"></div>
            <div class="sound-bar"></div>
          </div>
        </button>

        <button class="glass-btn" onclick="toggleCart(true)">
          <span>Bag</span>
          <span id="bag-count" style="color:var(--gold); margin-left:6px;">0</span>
        </button>
      </div>
    </header>

  </div>

  <!-- OBJECT INSPECTION MODAL -->
  <div id="detail-overlay" role="dialog" aria-modal="true">
    <button class="detail-close-btn" onclick="closeDetail()">✕</button>

    <div class="detail-left">
      <h2 class="det-title" id="det-title">The Wiggle Butter Dish</h2>

      <div class="det-action-row">
        <span class="det-price" id="det-price">$58</span>
        <button class="det-buy-btn" id="det-add-btn">Add to Bag +</button>
      </div>
    </div>

    <div class="detail-right">
      <div class="det-img-frame" id="det-frame">
        <img id="det-img" src="" alt="Product Detail" />
        <canvas id="det-3d-canvas" style="display:none; width:100%; height:100%;"></canvas>
        <div id="det-3d-hint" style="display:none; position:absolute; bottom:16px; left:50%; transform:translateX(-50%); font-family:'Antonio',sans-serif; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.7); pointer-events:none; background:rgba(0,0,0,0.6); padding:6px 14px; border-radius:99px; backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,0.15); white-space:nowrap;">THREE.LatheGeometry · Drag to Spin</div>
      </div>
    </div>
  </div>

  <!-- SLIDE-OVER BAG DRAWER -->
  <aside id="cart-drawer">
    <div class="cart-head">
      <h3 class="cart-title">Bag</h3>
      <button onclick="toggleCart(false)" style="color:var(--bone); font-size:22px; cursor:pointer;">✕</button>
    </div>

    <div class="cart-items" id="cart-items">
      <!-- Items inserted dynamically -->
    </div>

    <div class="cart-foot">
      <div style="display:flex; justify-content:space-between; font-family:'Antonio',sans-serif; font-size:20px;">
        <span>Total:</span>
        <span id="cart-subtotal" style="color:var(--gold);">$0</span>
      </div>
      <button class="det-buy-btn" style="width:100%; border-radius:99px;" onclick="triggerCheckout()">
        Checkout →
      </button>
    </div>
  </aside>

  <!-- THREE.JS BOTANICAL MEADOW & 3D HOMEPAGE SHADERS -->
  <script>

        {

      // ─── 2. WebGL Scene & Renderer Setup ───

      // ─── Procedural Wood Textures ───
      function createWoodTexture() {
        const c = document.createElement('canvas');
        c.width = 1024;
        c.height = 1024;
        const ctx = c.getContext('2d');

        // Blonde Scandinavian Birch / Pine base tone
        ctx.fillStyle = '#E6D3B6';
        ctx.fillRect(0, 0, 1024, 1024);

        // Longitudinal wood fiber streaks
        for (let x = 0; x < 1024; x++) {
          const n = Math.sin(x * 0.07) * 0.5 + Math.sin(x * 0.22) * 0.3 + (Math.random() - 0.5) * 0.25;
          const tone = Math.floor(215 + n * 24);
          ctx.fillStyle = `rgba(${tone}, ${Math.floor(tone * 0.88)}, ${Math.floor(tone * 0.72)}, 0.4)`;
          ctx.fillRect(x, 0, 1, 1024);
        }

        // Concentric annual growth rings & lathe lines
        for (let y = 0; y < 1024; y += 3) {
          const lNoise = Math.sin(y * 0.14) * 0.5 + (Math.random() - 0.5) * 0.5;
          if (lNoise > 0.18) {
            ctx.fillStyle = `rgba(135, 92, 52, ${0.08 + lNoise * 0.08})`;
            ctx.fillRect(0, y, 1024, 1.6);
          }
        }

        // Warm organic knots
        for (let i = 0; i < 5; i++) {
          const kx = 120 + Math.random() * 780;
          const ky = 80 + Math.random() * 860;
          const grad = ctx.createRadialGradient(kx, ky, 2, kx, ky, 35 + Math.random() * 30);
          grad.addColorStop(0, 'rgba(120, 78, 42, 0.25)');
          grad.addColorStop(0.5, 'rgba(160, 115, 75, 0.1)');
          grad.addColorStop(1, 'rgba(230, 211, 182, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(kx, ky, 30, 10, 0.1, 0, Math.PI * 2);
          ctx.fill();
        }

        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(1, 2);
        return tex;
      }

      function createWoodBumpTexture() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#808080';
        ctx.fillRect(0, 0, 512, 512);

        for (let y = 0; y < 512; y += 2) {
          const val = Math.floor(128 + Math.sin(y * 0.45) * 22 + (Math.random() - 0.5) * 16);
          ctx.fillStyle = `rgb(${val},${val},${val})`;
          ctx.fillRect(0, y, 512, 1);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      const woodMap = createWoodTexture();
      const woodBump = createWoodBumpTexture();

      const woodMaterial = new THREE.MeshStandardMaterial({
        map: woodMap,
        bumpMap: woodBump,
        bumpScale: 0.012,
        roughness: 0.36,
        metalness: 0.02,

      });

      // ─── THREE.LatheGeometry Scandinavian Sculptures ───
      function getLatheGeometry(id) {
        let curve;
        if (id === 'svamp') {
          // The Småland "Svamp" Totem: Flared base, elongated pillar shaft, groove, and bulbous mushroom dome
          curve = new THREE.SplineCurve([
            new THREE.Vector2(0, -0.85),
            new THREE.Vector2(0.36, -0.83),
            new THREE.Vector2(0.32, -0.72),
            new THREE.Vector2(0.20, -0.35),
            new THREE.Vector2(0.18, 0.0),
            new THREE.Vector2(0.19, 0.28),
            new THREE.Vector2(0.15, 0.36),
            new THREE.Vector2(0.38, 0.50),
            new THREE.Vector2(0.43, 0.65),

          ]);
        } else if (id === 'kvist') {
          // Kvist Contoured Peg: Mounting plate, collar, ergonomic curved waist, expanding into a smooth rounded knob head
          curve = new THREE.SplineCurve([
            new THREE.Vector2(0, -0.85),
            new THREE.Vector2(0.40, -0.83),
            new THREE.Vector2(0.35, -0.74),
            new THREE.Vector2(0.24, -0.62),
            new THREE.Vector2(0.17, -0.30),
            new THREE.Vector2(0.23, 0.0),
            new THREE.Vector2(0.19, 0.25),
            new THREE.Vector2(0.34, 0.52),
            new THREE.Vector2(0.36, 0.68),

            new THREE.Vector2(0.0, 0.85)
          ]);
        } else if (id === 'sundborn') {
          // The Sundborn Bobbin Monolith: Multi-tiered stacked spherical beads and crowning bulb
          curve = new THREE.SplineCurve([
            new THREE.Vector2(0, -0.85),
            new THREE.Vector2(0.38, -0.83),
            new THREE.Vector2(0.34, -0.72),
            new THREE.Vector2(0.22, -0.62),
            new THREE.Vector2(0.33, -0.46),
            new THREE.Vector2(0.18, -0.30),
            new THREE.Vector2(0.31, -0.12),
            new THREE.Vector2(0.16, 0.06),
            new THREE.Vector2(0.28, 0.24),
            new THREE.Vector2(0.18, 0.42),
            new THREE.Vector2(0.34, 0.60),
            new THREE.Vector2(0.28, 0.76),
            new THREE.Vector2(0.0, 0.85)
          ]);
        } else {
          // Gotland Tactile Tumbled Obelisk: Smooth weighted teardrop/egg obelisk
          curve = new THREE.SplineCurve([
            new THREE.Vector2(0, -0.85),
            new THREE.Vector2(0.32, -0.82),
            new THREE.Vector2(0.36, -0.70),
            new THREE.Vector2(0.32, -0.38),
            new THREE.Vector2(0.22, -0.05),
            new THREE.Vector2(0.23, 0.22),
            new THREE.Vector2(0.33, 0.50),
            new THREE.Vector2(0.30, 0.70),
            new THREE.Vector2(0.16, 0.83),
            new THREE.Vector2(0.0, 0.85)
          ]);
        }

        const pts = curve.getPoints(64);
        const geo = new THREE.LatheGeometry(pts, 48);
        geo.computeVertexNormals();
        return geo;
      }

      // Procedural silhouette thumbnails for cart drawer
      function createLatheThumbnail(id) {
        const c = document.createElement('canvas');
        c.width = 120;
        c.height = 120;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#14161C';
        ctx.fillRect(0, 0, 120, 120);

        // Brass accent ring
        ctx.strokeStyle = '#E5C384';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(6, 6, 108, 108);

        // Draw turned silhouette
        ctx.fillStyle = '#E8D5B5';
        ctx.beginPath();
        if (id === 'svamp') {
          ctx.arc(60, 42, 22, Math.PI, 0, false);
          ctx.lineTo(66, 88);
          ctx.lineTo(76, 96);
          ctx.lineTo(44, 96);
          ctx.lineTo(54, 88);
          ctx.closePath();
        } else if (id === 'kvist') {
          ctx.arc(60, 38, 18, Math.PI, 0, false);
          ctx.bezierCurveTo(72, 60, 52, 75, 74, 96);
          ctx.lineTo(46, 96);
          ctx.bezierCurveTo(68, 75, 48, 60, 60, 38);
          ctx.closePath();
        } else if (id === 'sundborn') {
          ctx.arc(60, 30, 12, 0, Math.PI * 2);
          ctx.arc(60, 52, 14, 0, Math.PI * 2);
          ctx.arc(60, 76, 16, 0, Math.PI * 2);
          ctx.rect(42, 92, 36, 6);
        } else {
          ctx.ellipse(60, 58, 22, 34, 0, 0, Math.PI * 2);
        }
        ctx.fill();
        return c.toDataURL();
      }

      const LATHE_IDS = ['svamp', 'kvist', 'sundborn', 'pestle'];

      // ─── 3. 3D Floating Kinetic Product Arc ───
      const cardsGroup = new THREE.Group();
      scene.add(cardsGroup);

      const textureLoader = new THREE.TextureLoader();
      const cardMeshes = [];
      const CARD_COUNT = PRODUCTS.length;
      const ARC_RADIUS = 5.2;

      // Card Geometry: Rounded bevel plaque with photographic face
      const cardGeo = new THREE.PlaneGeometry(1.6, 2.0);

      PRODUCTS.forEach((prod, idx) => {
        if (LATHE_IDS.includes(prod.id)) {
          prod.thumbImg = createLatheThumbnail(prod.id);

          // Pure Freestanding 3D Procedural Lathe Sculpture (NO flat backing panes)
          const group = new THREE.Group();
          group.userData.index = idx;
          group.userData.product = prod;
          group.userData.isLathe = true;

          // Live 3D Lathe Sculpture - freestanding, clean, sculptural
          const latheGeo = getLatheGeometry(prod.id);
          const latheMesh = new THREE.Mesh(latheGeo, woodMaterial.clone());
          latheMesh.position.set(0, 0, 0);
          latheMesh.scale.set(1.35, 1.35, 1.35);
          latheMesh.userData = group.userData;
          group.add(latheMesh);
          group.userData.latheMesh = latheMesh;

          cardsGroup.add(group);
          cardMeshes.push(group);

        } else {
          // Photographic Product Plaque
          const tex = textureLoader.load(prod.img);
          tex.generateMipmaps = true;

          const mat = new THREE.MeshBasicMaterial({
            map: tex,
            side: THREE.DoubleSide,
          });

          const mesh = new THREE.Mesh(cardGeo, mat);
          mesh.userData.index = idx;
          mesh.userData.product = prod;

          // Brass Frame Trim behind the picture
          const frameGeo = new THREE.PlaneGeometry(1.66, 2.06);
          const frameMat = new THREE.MeshBasicMaterial({ color: 0xE5C384, side: THREE.DoubleSide });
          const frame = new THREE.Mesh(frameGeo, frameMat);
          frame.position.z = -0.01;
          mesh.add(frame);

          cardsGroup.add(mesh);
          cardMeshes.push(mesh);
        }
      });

      // ─── 5. State, Physics & Orbital Positioning ───
      let arcAngle = 0;
      let targetArcAngle = 0;
      let isDragging = false;
      let startMouseX = 0;
      let startAngle = 0;
      let activeIndex = 0;
      let isDetailActive = false;

      function updateCardTransforms() {
        const step = (Math.PI * 2) / CARD_COUNT;

        for (let i = 0; i < CARD_COUNT; i++) {
          const mesh = cardMeshes[i];
          const theta = arcAngle + i * step;

          // Elliptical orbit with depth curve
          const x = Math.sin(theta) * ARC_RADIUS;
          const z = Math.cos(theta) * (ARC_RADIUS * 0.75) - 0.5;
          const y = Math.sin(theta * 2.0) * 0.15;

          mesh.position.set(x, y, z);
          mesh.rotation.y = theta + Math.PI;

          // Parallax tilt towards center
          mesh.rotation.z = Math.sin(theta) * 0.08;

          // Depth fog & scaling for distant cards
          const distFromFront = Math.cos(theta); // 1 = front, -1 = back
          const scale = 0.75 + 0.35 * Math.max(0, distFromFront);
          mesh.scale.set(scale, scale, scale);

          // Darken back cards / adjust opacity
          const targetOpacity = Math.max(0.2, 0.4 + 0.6 * distFromFront);
          if (mesh.material) {
            mesh.material.opacity = targetOpacity;
            mesh.material.transparent = true;
          } else {
            mesh.traverse((child) => {
              if (child.isMesh && child.material && child.material.transparent) {
                child.material.opacity = targetOpacity;
              }
            });
          }
        }
      }

      window.orbitTo = function (targetIdx) {
        playChime();
        activeIndex = ((targetIdx % CARD_COUNT) + CARD_COUNT) % CARD_COUNT;
        const step = (Math.PI * 2) / CARD_COUNT;
        targetArcAngle = -targetIdx * step;
      };

      window.prevProduct = function () {
        orbitTo(activeIndex - 1);
      };

      window.nextProduct = function () {
        orbitTo(activeIndex + 1);
      };

      window.openCurrentDetail = function () {
        openDetail(PRODUCTS[activeIndex]);
      };

      // ─── 6. Raycasting & Click-to-Inspect ───
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(-999, -999);

      const cursor = document.getElementById('cursor');
      let mx = window.innerWidth / 2, my = window.innerHeight / 2;
      let cx = mx, cy = my;

      window.addEventListener('pointermove', (e) => {
        mx = e.clientX;
        my = e.clientY;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        if (isDragging) {
          const dx = e.clientX - startMouseX;
          targetArcAngle = startAngle + (dx / window.innerWidth) * Math.PI * 1.5;
        }

        // Raycasting for cards & 3D lathe objects
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(cardMeshes, true);

        if (intersects.length > 0 && !isDetailActive) {
          cursor.classList.add('hover');
        } else {
          cursor.classList.remove('hover');
        }
      });

      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.ui-layer, #detail-overlay, #cart-drawer')) return;
        isDragging = true;
        startMouseX = e.clientX;
        startAngle = targetArcAngle;
        cursor.classList.add('drag');
      });

      function getIntersectedProduct(intersects) {
        if (!intersects || intersects.length === 0) return null;
        let curr = intersects[0].object;
        while (curr) {
          if (curr.userData && curr.userData.product) return curr.userData.product;
          curr = curr.parent;
        }
        return null;
      }

      window.addEventListener('pointerup', (e) => {
        cursor.classList.remove('drag');
        if (!isDragging) return;
        isDragging = false;

        // Snap to closest card if dragged
        const step = (Math.PI * 2) / CARD_COUNT;
        const closestIdx = Math.round(-targetArcAngle / step);
        orbitTo(closestIdx);

        // If tap was direct on a card or lathe sculpture, open detail
        if (Math.abs(e.clientX - startMouseX) < 6) {
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(cardMeshes, true);
          const prod = getIntersectedProduct(intersects);
          if (prod) {
            openDetail(prod);
          }
        }
      });

      window.addEventListener('wheel', (e) => {
        if (isDetailActive) return;
        targetArcAngle += (e.deltaY * 0.0018);
      }, { passive: true });

      // ─── 7. Inspection Detail Sheet & Interactive 3D Viewer ───
      const detailOverlay = document.getElementById('detail-overlay');
      const heroCenter = document.getElementById('hero-center');

      // Mini-viewer for 3D Lathe Inspection in Modal
      let detailRenderer = null;
      let detailScene = null;
      let detailCamera = null;
      let detailMesh = null;
      let detailAnimId = null;
      let isDetailDragging = false;
      let detailPrevMouse = { x: 0, y: 0 };
      let detailRot = { x: 0.1, y: 0 };

      function initDetail3DViewer(productId) {
        const c = document.getElementById('det-3d-canvas');
        if (!c) return;

        if (!detailRenderer) {
          detailRenderer = new THREE.WebGLRenderer({ canvas: c, antialias: true, alpha: true });
          detailRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          detailRenderer.toneMapping = THREE.ACESFilmicToneMapping;
          detailRenderer.toneMappingExposure = 1.2;

          detailScene = new THREE.Scene();
          detailCamera = new THREE.PerspectiveCamera(40, c.clientWidth / c.clientHeight, 0.1, 50);
          detailCamera.position.set(0, 0, 3.2);

          const amb = new THREE.AmbientLight(0xFFF8EE, 0.9);
          detailScene.add(amb);

          const key = new THREE.DirectionalLight(0xFFEEDD, 1.8);
          key.position.set(3, 5, 4);
          detailScene.add(key);

          const fill = new THREE.DirectionalLight(0x88AACC, 0.6);
          fill.position.set(-3, -2, -2);
          detailScene.add(fill);

          // Drag to spin listeners
          c.addEventListener('pointerdown', (e) => {
            isDetailDragging = true;
            detailPrevMouse = { x: e.clientX, y: e.clientY };
            c.setPointerCapture(e.pointerId);
          });
          c.addEventListener('pointermove', (e) => {
            if (!isDetailDragging) return;
            const dx = e.clientX - detailPrevMouse.x;
            const dy = e.clientY - detailPrevMouse.y;
            detailRot.y += dx * 0.015;
            detailRot.x = Math.max(-0.6, Math.min(0.6, detailRot.x + dy * 0.015));
            detailPrevMouse = { x: e.clientX, y: e.clientY };
          });
          c.addEventListener('pointerup', (e) => {
            isDetailDragging = false;
            try { c.releasePointerCapture(e.pointerId); } catch (_) {}
          });
        }

        // Resize renderer to container
        const rect = c.getBoundingClientRect();
        const w = rect.width || 440;
        const h = rect.height || 550;
        detailRenderer.setSize(w, h, false);
        detailCamera.aspect = w / h;
        detailCamera.updateProjectionMatrix();

        // Swap geometry
        if (detailMesh) detailScene.remove(detailMesh);
        const geo = getLatheGeometry(productId);
        detailMesh = new THREE.Mesh(geo, woodMaterial.clone());
        detailMesh.scale.set(1.4, 1.4, 1.4);
        detailMesh.position.set(0, -0.05, 0);
        detailScene.add(detailMesh);
        detailRot = { x: 0.1, y: 0.3 };

        function renderDetailLoop() {
          if (!isDetailActive) return;
          if (!isDetailDragging && detailMesh) {
            detailRot.y += 0.008; // subtle idle rotation
          }
          if (detailMesh) {
            detailMesh.rotation.y = detailRot.y;
            detailMesh.rotation.x = detailRot.x;
          }
          detailRenderer.render(detailScene, detailCamera);
          detailAnimId = requestAnimationFrame(renderDetailLoop);
        }
        cancelAnimationFrame(detailAnimId);
        renderDetailLoop();
      }

      function stopDetail3D() {
        if (detailAnimId) {
          cancelAnimationFrame(detailAnimId);
          detailAnimId = null;
        }
      }

      function openDetail(product) {
        playChime();
        isDetailActive = true;
        if (heroCenter) heroCenter.classList.add('blurred');

        document.getElementById('det-title').textContent = product.name;
        document.getElementById('det-price').textContent = `$${product.price}`;

        const imgEl = document.getElementById('det-img');
        const canvas3d = document.getElementById('det-3d-canvas');
        const hint3d = document.getElementById('det-3d-hint');

        if (LATHE_IDS.includes(product.id)) {
          imgEl.style.display = 'none';
          canvas3d.style.display = 'block';
          if (hint3d) hint3d.style.display = 'block';
          setTimeout(() => initDetail3DViewer(product.id), 50);
        } else {
          stopDetail3D();
          canvas3d.style.display = 'none';
          if (hint3d) hint3d.style.display = 'none';
          imgEl.style.display = 'block';
          imgEl.src = product.img;
        }

        document.getElementById('det-add-btn').onclick = () => {
          addToBag(product.name, product.price, product.thumbImg || product.img);
        };

        detailOverlay.classList.add('active');
      }

      window.closeDetail = function () {
        playChime();
        isDetailActive = false;
        stopDetail3D();
        detailOverlay.classList.remove('active');
        if (heroCenter) heroCenter.classList.remove('blurred');
      };

      // ─── 8. Shopping Bag State ───
      const cart = [];
      window.toggleCart = function (open) {
        const d = document.getElementById('cart-drawer');
        if (open) d.classList.add('open');
        else d.classList.remove('open');
      };

      window.addToBag = function (name, price, img) {
        playChime();
        const existing = cart.find(i => i.name === name);
        if (existing) existing.qty++;
        else cart.push({ name, price, img, qty: 1 });
        renderCart();
        toggleCart(true);
      };

      function renderCart() {
        const container = document.getElementById('cart-items');
        container.innerHTML = '';
        let total = 0, count = 0;

        cart.forEach((item, idx) => {
          total += item.price * item.qty;
          count += item.qty;

          const el = document.createElement('div');
          el.className = 'cart-item';
          el.innerHTML = `
            <img src="${item.img}" style="width:58px; height:58px; border-radius:10px; object-fit:cover;" />
            <div style="flex:1;">
              <h4 style="font-family:'Antonio',sans-serif; font-size:16px; color:var(--bone);">${item.name}</h4>
              <p style="font-size:13px; color:var(--gold);">$${item.price} USD</p>
              <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
                <button onclick="updateQty(${idx}, -1)" style="color:#FFF; padding:2px 8px; border:1px solid rgba(255,255,255,0.2); border-radius:4px; cursor:pointer;">-</button>
                <span style="font-size:12px;">${item.qty}</span>
                <button onclick="updateQty(${idx}, 1)" style="color:#FFF; padding:2px 8px; border:1px solid rgba(255,255,255,0.2); border-radius:4px; cursor:pointer;">+</button>
              </div>
            </div>
          `;
          container.appendChild(el);
        });

        document.getElementById('bag-count').textContent = count;
        document.getElementById('cart-subtotal').textContent = `$${total} USD`;
      }

      window.updateQty = function (idx, delta) {
        playChime();
        cart[idx].qty += delta;
        if (cart[idx].qty <= 0) cart.splice(idx, 1);
        renderCart();
      };

      window.triggerCheckout = function () {
        alert("✦ Välkommen till Reum.store!\n\nYour bag is ready. In production, this links directly to your free Stripe Checkout or Shopify Lite link ($0/month hosting fee)!");
      };

      // ─── 9. Generative Ambient Audio Synthesizer ───
      let audioCtx = null;
      let isSoundActive = false;
      let drone1 = null, drone2 = null;

      function playChime() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520 + Math.random() * 300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.12);

        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      }

      window.toggleSound = function () {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        if (isSoundActive) {
          if (drone1) { drone1.stop(); drone1 = null; }
          if (drone2) { drone2.stop(); drone2 = null; }
          isSoundActive = false;
          document.body.classList.remove('sound-active');
        } else {
          // Ethereal Nordic D-minor drone chord (D2 + A2)
          drone1 = audioCtx.createOscillator();
          drone2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          drone1.type = 'sine';
          drone1.frequency.setValueAtTime(73.42, audioCtx.currentTime); // D2
          drone2.type = 'triangle';
          drone2.frequency.setValueAtTime(110.0, audioCtx.currentTime); // A2

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(320, audioCtx.currentTime);

          gain.gain.setValueAtTime(0.025, audioCtx.currentTime);

          drone1.connect(gain);
          drone2.connect(gain);
          gain.connect(filter);
          filter.connect(audioCtx.destination);

          drone1.start();
          drone2.start();

          isSoundActive = true;
          document.body.classList.add('sound-active');
        }
      };

      // ─── 10. Animation Loop ───
      let clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();

        // Smooth spring easing for arc rotation
        arcAngle += (targetArcAngle - arcAngle) * 0.085;
        updateCardTransforms();

        // Rotate individual 3D lathe sculptures gently in space
        for (let i = 0; i < cardMeshes.length; i++) {
          const m = cardMeshes[i];
          if (m.userData && m.userData.latheMesh) {
            m.userData.latheMesh.rotation.y += 0.012;
          }
        }

        // Gentle camera float
        camera.position.x = Math.sin(elapsedTime * 0.3) * 0.25;
        camera.position.y = 1.35 + Math.cos(elapsedTime * 0.4) * 0.15;
        camera.lookAt(0, 0.4, 0);

        // Fluid cursor
        cx += (mx - cx) * 0.22;
        cy += (my - cy) * 0.22;
        cursor.style.left = `${cx}px`;
        cursor.style.top = `${cy}px`;

        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Remove loader
      setTimeout(() => {
        document.getElementById('loader').classList.add('gone');
        animate();
      }, 500);

    })();
  </script>
</body>
